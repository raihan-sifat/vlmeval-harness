[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmeval"
version = "0.1.0"
description = "A reproducible evaluation harness for vision-language models on image understanding tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VLM Eval contributors" }]
keywords = ["vlm", "vision-language", "benchmark", "evaluation", "multimodal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Only genuinely required. The YAML config reader has a built-in fallback
    # and the progress bar degrades to plain lines, so neither pyyaml nor tqdm
    # is needed to run an evaluation -- see the `config` and `cli` extras.
    "pillow>=10.0",
]

[project.optional-dependencies]
# Nicer config files (a built-in subset reader is used otherwise).
config = ["pyyaml>=6.0"]
# Progress bars (falls back to periodic plain-text lines).
cli = ["tqdm>=4.66"]
# Cloud model providers. Install only what you need.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
google = ["google-genai>=0.3"]
# Local open-weight models (quantized loading recommended for small GPUs).
local = ["torch>=2.2", "transformers>=4.46", "accelerate>=0.33", "qwen-vl-utils>=0.0.8"]
# Dataset loading from the Hugging Face Hub.
data = ["datasets>=2.20"]
# Tables and figures.
analysis = ["pandas>=2.2", "matplotlib>=3.8", "scipy>=1.13"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = [
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=0.3",
    "datasets>=2.20",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.13",
]

[project.scripts]
vlmeval = "vlmeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
